<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  ══════════════════════════════════════════════════════════════════════════
  run.html — the only page in Dossier that is allowed to touch the network

  dossier.html carries this, and has since long before there was a model:

      <meta http-equiv="Content-Security-Policy"
            content="connect-src 'none'; form-action 'none'">

  connect-src 'none' means the application cannot open a connection to
  anywhere, to any host, ever. Not a mistake, not a leak, not a library that
  decided to phone home — the browser refuses it before the request is made.
  That is what turns "nothing leaves this folder" from a promise into
  something you can check in one line.

  A downloaded model needs the network, so the two cannot live in the same
  page. Rather than punch a hole in the policy — which would weaken it for
  everyone, including everyone who never turns the model on — the model runs
  HERE, in a page of its own, with a policy of its own.

  What that buys:

    · dossier.html still cannot make a network call. Unchanged, still
      provable, still true when the model is switched off AND when it is on.
    · This page can reach a named handful of hosts and nothing else: the
      library CDNs and the places the weights live. Several are listed
      because company filters block them unevenly and the one that is open
      cannot be guessed from here. It cannot reach your intranet, your
      ticketing system, or anywhere else on your network.
    · It holds no records. It is handed one sentence and a list of question
      labels, and it hands back a number. It has no access to dossier.json,
      to your workspace folder, or to anything you have typed but that one
      line.
    · web-llm compiles WebAssembly, which needs a permission dossier.html
      should not have. It is granted here and only here.

  It is loaded in a hidden frame, only once you switch the model on, and
  torn down when you switch it off.
  ══════════════════════════════════════════════════════════════════════════
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://unpkg.com https://esm.sh;
  connect-src 'self' blob: data: https://cdn.jsdelivr.net https://unpkg.com https://esm.sh https://huggingface.co https://*.huggingface.co https://*.hf.co https://hf-mirror.com https://*.hf-mirror.com https://raw.githubusercontent.com https://*.githubusercontent.com;
  worker-src 'self' blob:;
  style-src 'unsafe-inline';
  form-action 'none';
  base-uri 'none'">
<title>Dossier — model runner</title>
<style>
  body{font:12px/1.6 ui-monospace,Consolas,monospace;margin:0;padding:10px;
       color:#8a8580;background:#faf8f5}
  @media (prefers-color-scheme: dark){ body{color:#8a8580;background:#17161a} }
</style>
</head>
<body>
<p id="s">Model runner. Nothing happens here until Dossier asks it to.</p>
<!-- A transcript rather than one line that overwrites itself. A sequence of
     steps with the seconds each one took is the whole diagnosis; the last
     step alone is not. -->
<pre id="log" style="margin:6px 0 0;white-space:pre-wrap;font:inherit;opacity:.85"></pre>
<p style="opacity:.6">run.html 1.4</p>
<script>
"use strict";
/* ── the conversation with dossier.html ──────────────────────────────────
   Deliberately small. Four commands in, results and progress out, and
   nothing in either direction that is not one of them. */

/* Bumped whenever this file changes. It is reported to the panel, which
   shows it, because "I replaced the file" and "the browser is running the
   file I replaced" are different claims and only one of them is checkable
   from the outside. A stale copy in an iframe is invisible otherwise. */
const RUN_VERSION = "1.4";

let webllm = null;
let engine = null;
let parentWin = null;

const T0 = Date.now();
const secs = () => ((Date.now() - T0) / 1000).toFixed(1).padStart(5) + "s  ";
const say = t => { const el = document.getElementById("s"); if (el) el.textContent = t; };
/* every step, kept, with the clock against it */
function log(t){
  const el = document.getElementById("log");
  if (el) el.textContent += secs() + t + "\n";
}
/* say it here AND across the frame, so the panel shows the checking going on
   rather than another stretch of silence it cannot tell from a hang */
const step = t => { say(t); log(t); post({ evt:"progress", progress:0, text:t }); };

function post(msg){
  try { (parentWin || window.parent).postMessage(Object.assign({ __dossier:1 }, msg), "*"); }
  catch(e){}
}

/* ── the folder, if the model is sitting in it ───────────────────────────
   A great many company networks block huggingface.co outright, and no code
   here can argue with a firewall. So before reaching for the internet this
   looks for the model in the folder next to it, and if it is there, uses it
   and never touches the network at all.

   models/index.json is the whole of the arrangement — a list saying what is
   present and where. No file, no local model, and it falls back to the CDN. */

let localCfg = null, localChecked = false;

async function findLocal(){
  if (localChecked) return localCfg;
  localChecked = true;
  try {
    const r = await fetch("models/index.json", { cache:"no-store" });
    if (!r.ok) return null;
    const list = await r.json();
    const models = (Array.isArray(list) ? list : list.model_list || [])
      .filter(m => m && m.model_id && m.model && m.model_lib);
    if (!models.length) return null;
    /* URLs are written relative to this page; web-llm wants absolute ones */
    const abs = u => new URL(u, location.href).href;
    localCfg = { model_list: models.map(m => Object.assign({}, m, {
      model: abs(m.model), model_lib: abs(m.model_lib) })) };
    return localCfg;
  } catch(e){ return null; }
}

/* the library, local copy first */
async function lib(url){
  if (webllm) return webllm;
  try { webllm = await import("./web-llm.js"); step("runtime: local copy"); return webllm; }
  catch(e){}
  step("fetching the runtime from " + (function(){ try { return new URL(url).host; }
       catch(e){ return url; } })());
  const t0 = Date.now();
  webllm = await import(url);
  log("  \u2713 runtime loaded in " + ((Date.now() - t0) / 1000).toFixed(1) + "s");
  return webllm;
}

async function doCatalogue(libUrl){
  const local = await findLocal();
  if (local) return local.model_list.map(m => ({ id:m.model_id, mb:0, local:true }));
  await lib(libUrl);
  const list = (webllm.prebuiltAppConfig && webllm.prebuiltAppConfig.model_list) || [];
  return list.map(m => ({ id:m.model_id,
    mb: m.vram_required_MB ? Math.round(m.vram_required_MB) : 0 }));
}

/* Point the weights at somewhere else. Company filters block huggingface.co
   far more often than they block the file itself, and the same public weights
   sit behind other addresses. Only the host is swapped; the paths inside the
   model repository are the library's own. */
function rehost(cfg, host){
  if (!cfg || !host) return cfg;
  const from = /^https:\/\/huggingface\.co/;
  const to = String(host).replace(/\/+$/, "");
  return { model_list: (cfg.model_list || []).map(m => Object.assign({}, m, {
    model: String(m.model || "").replace(from, to) })) };
}

/* ── does the weights host answer at all ────────────────────────────────
   web-llm's own fetches have no deadline. A host that accepts the connection
   and then says nothing leaves the download sitting at 0% for ever, with no
   error to show and nothing to distinguish it from a slow link. So one small
   file is asked for first, with a deadline.

   Any answer counts as reachable — a 404 still proves the host is there and
   talking. Only silence fails, because silence is the thing that cannot be
   diagnosed from the other side. */
async function reachable(url, ms){
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms || 12000);
  try {
    await fetch(url, { method:"GET", mode:"no-cors", cache:"no-store", signal:ac.signal });
    return { ok:true };
  } catch(e){
    return { ok:false, aborted: e && e.name === "AbortError",
             why: String((e && e.message) || e) };
  } finally { clearTimeout(t); }
}

async function preflight(cfg, model){
  const entry = ((cfg && cfg.model_list) || []).find(m => m.model_id === model);
  if (!entry) return;
  const checks = [];
  if (entry.model)
    checks.push(["the weights", String(entry.model).replace(/\/+$/, "") +
                                "/resolve/main/mlc-chat-config.json"]);
  if (entry.model_lib) checks.push(["the model library", entry.model_lib]);
  for (const [what, url] of checks){
    const host = (function(){ try { return new URL(url).host; } catch(e){ return url; } })();
    step("checking " + host + " \u2014 " + what);
    const t0 = Date.now();
    const r = await reachable(url, 8000);
    const took = ((Date.now() - t0) / 1000).toFixed(1) + "s";
    if (r.ok){ log("  \u2713 " + host + " answered in " + took); continue; }
    log("  \u2717 " + host + " " + (r.aborted ? "silent for " + took : r.why));
    throw new Error(r.aborted
      ? host + " accepted the connection and then said nothing for eight seconds. That is a " +
        "filter swallowing the request rather than refusing it, which is why the download sat " +
        "at 0%. Run model/check.html on this machine \u2014 it tries the alternatives and says " +
        "which are open."
      : host + " could not be reached for " + what + " (" + r.why + "). " +
        "Run model/check.html on this machine to see what it can reach.");
  }
  log("  all hosts answered \u2014 handing over to the runtime");
}

async function doLoad(libUrl, model, host){
  const local = await findLocal();
  await lib(libUrl);
  const mk = webllm.CreateMLCEngine || webllm.CreateEngine;
  if (typeof mk !== "function")
    throw new Error("this build of web-llm has no CreateMLCEngine — pin another version");
  const opts = {
    initProgressCallback: r => {
      const pct = Math.round(((r && r.progress) || 0) * 100);
      say(pct + "% · " + ((r && r.text) || ""));
      post({ evt:"progress", progress:(r && r.progress) || 0, text:(r && r.text) || "" });
    }
  };
  if (local) opts.appConfig = local;
  else if (host){
    /* the library's own list, with the weight host swapped */
    const pre = webllm.prebuiltAppConfig;
    if (pre && pre.model_list) opts.appConfig = rehost(pre, host);
  }
  /* nothing to preflight when the files are on the disk already */
  if (!local) await preflight(opts.appConfig || webllm.prebuiltAppConfig, model);
  step((local ? "loading " : "downloading ") + model + "\u2026");
  engine = await mk(model, opts);
  /* keep the download rather than letting the browser evict it */
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
  say("ready · " + model + (local ? " (from the folder)" : ""));
  return { model:model, local:!!local };
}

async function doChat(opts){
  if (!engine) throw new Error("no model loaded");
  const r = await engine.chat.completions.create(opts);
  /* only the text comes back across — nothing else from the runtime is
     anything dossier.html should be handling */
  return { text: (r && r.choices && r.choices[0] && r.choices[0].message &&
                  r.choices[0].message.content) || "" };
}

/* What this exact library version wants for this exact model. Read out of
   the library rather than remembered, because the model library file is
   pinned to a version of the runtime and a mismatched pair fails in a way
   that looks like a corrupt download. */
async function doPlan(libUrl, model){
  await lib(libUrl);
  const list = (webllm.prebuiltAppConfig && webllm.prebuiltAppConfig.model_list) || [];
  const e = list.find(m => m.model_id === model) || list[0];
  if (!e) throw new Error("this library lists no models");
  return { model_id:e.model_id, model:e.model, model_lib:e.model_lib,
           mb: e.vram_required_MB ? Math.round(e.vram_required_MB) : 0 };
}

async function doUnload(){
  try { if (engine && engine.unload) await engine.unload(); } catch(e){}
  engine = null;
  say("stopped.");
  return true;
}

window.addEventListener("message", async e => {
  const m = e.data;
  if (!m || m.__dossier !== 1 || !m.cmd) return;
  /* the frame is same-origin by construction; anything from elsewhere is not
     Dossier and is not answered */
  if (e.origin !== window.location.origin && e.origin !== "null") return;
  parentWin = e.source || window.parent;
  try {
    let result;
    if (m.cmd === "ping")           result = { version:RUN_VERSION };
    else if (m.cmd === "catalogue") result = await doCatalogue(m.lib);
    else if (m.cmd === "load")      result = await doLoad(m.lib, m.model, m.host);
    else if (m.cmd === "chat")      result = await doChat(m.opts);
    else if (m.cmd === "plan")      result = await doPlan(m.lib, m.model);
    else if (m.cmd === "unload")    result = await doUnload();
    else throw new Error("unknown command " + m.cmd);
    post({ id:m.id, ok:true, result:result });
  } catch(err){
    log("FAILED: " + String((err && err.message) || err));
    say("failed: " + String((err && err.message) || err));
    post({ id:m.id, ok:false, error:String((err && err.message) || err) });
  }
});

post({ evt:"up" });
</script>
</body>
</html>
