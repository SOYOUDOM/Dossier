<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resolv Telegram relay</title>

<!-- ══════════════════════════════════════════════════════════════════════
     THE SECOND PAGE ALLOWED OUT, AND ONLY TO ONE PLACE

     dossier.html cannot reach the internet; its content security policy
     says connect-src http://127.0.0.1:* and the browser holds it to that.
     Reminders on your phone need exactly one conversation with the outside
     world - with Telegram's Bot API - so, like flow/relay.html, that
     conversation happens here instead: a page with no records, no access to
     dossier.json, that talks to the application only through postMessage.

     Where flow/relay.html has to allow any https address (your flow's URL is
     typed in at runtime), this one names its only destination in its own
     policy: https://api.telegram.org. It could not post your reminders
     anywhere else if it tried - the browser would stop it.

     What it sends is what Resolv hands it: the few lines of a reminder, and
     your answers to the buttons under it. The bot token is a password - it
     never appears in this page's log, which is the kind of thing people
     paste into a chat when asking for help.
     ══════════════════════════════════════════════════════════════════════ -->

<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'unsafe-inline';
  connect-src https://api.telegram.org;
  form-action 'none';
  base-uri 'none'">

<style>
  body{margin:0;padding:14px;font:12px/1.6 ui-monospace,Consolas,monospace;
       background:#0f1116;color:#d6dae3}
  h1{font:600 12px/1.4 system-ui,sans-serif;color:#8ea2c8;margin:0 0 10px;
     text-transform:uppercase;letter-spacing:.09em}
  #log{white-space:pre-wrap;word-break:break-word;color:#98a0b3;font-size:11px}
</style>
</head>
<body>
<h1>Resolv Telegram relay</h1>
<div id="log"></div>

<script>
"use strict";

const TG_RELAY_VERSION = "1.0";
const API = "https://api.telegram.org/bot";
const T0 = Date.now();
const el = document.getElementById("log");

/* the Bot API methods Resolv uses, and nothing else - no files, no
   webhooks, no chat administration */
const METHODS = ["getMe", "getUpdates", "sendMessage", "editMessageText",
                 "answerCallbackQuery", "setMyCommands", "getWebhookInfo"];
/* what a bot token looks like: the bot's number, a colon, and a secret */
const TOKEN = /^\d{5,15}:[A-Za-z0-9_-]{30,64}$/;

function secs(){ return ((Date.now() - T0) / 1000).toFixed(1).padStart(6) + "s  "; }
function log(t){
  el.textContent += secs() + t + "\n";
  /* a relay left open all day keeps the last few hundred lines, not all */
  if (el.textContent.length > 20000) el.textContent = el.textContent.slice(-15000);
}

function fail(kind, why, extra){
  const e = new Error(why); e.kind = kind;
  if (extra) Object.assign(e, extra);
  return e;
}

/* ── one call ────────────────────────────────────────────────────────────
   Form-encoded on purpose: a POST of application/x-www-form-urlencoded is a
   "simple" request, so there is no preflight to fail, and the Bot API reads
   it exactly as it reads JSON. Anything that is not a string (a keyboard, a
   list) goes as JSON text in its field, which is what the API expects. */
async function call(m){
  const method = String(m.method || "");
  const token = String(m.token || "");
  if (METHODS.indexOf(method) < 0) throw fail("method", "Not a method this relay makes: " + method);
  if (!TOKEN.test(token)) throw fail("token", "That does not look like a bot token. It is two parts with a colon between, like 123456789:AAF…, and BotFather gives it to you when you make the bot.");

  const params = m.params || {};
  const form = new URLSearchParams();
  Object.keys(params).forEach(k => {
    const v = params[k];
    if (v === undefined || v === null) return;
    form.append(k, typeof v === "string" ? v : JSON.stringify(v));
  });
  const ms = Math.max(3000, Math.min(60000, +m.timeout || 15000));
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), ms);
  const quiet = method === "getUpdates";
  if (!quiet) log(method + (params.chat_id ? " → chat " + params.chat_id : ""));
  let r, text = "";
  try {
    r = await fetch(API + token + "/" + method, {
      method: "POST", body: form, mode: "cors", credentials: "omit",
      redirect: "error", cache: "no-store", signal: ac.signal
    });
    text = await r.text();
  } catch(e){
    clearTimeout(timer);
    if (e && e.name === "AbortError"){
      if (quiet) return { ok:true, result:[] };
      log("  ✗ no answer within " + (ms / 1000) + "s");
      throw fail("timeout", "Telegram did not answer within " + (ms / 1000) + " seconds.");
    }
    log("  ✗ " + String((e && e.message) || e));
    throw fail("blocked", "Telegram could not be reached from this PC. Either the network blocks api.telegram.org, or there is no internet connection right now.");
  }
  clearTimeout(timer);
  let j = null;
  try { j = JSON.parse(text); } catch(e){}
  if (!j) throw fail("reply", "Telegram answered " + r.status + " with something that is not its usual reply.");
  if (!j.ok){
    if (!quiet || r.status !== 409) log("  ✗ " + r.status + " " + (j.description || ""));
    throw fail(r.status === 401 || r.status === 404 ? "token" : r.status === 409 ? "conflict"
               : r.status === 403 ? "blocked-by-user" : r.status === 400 ? "bad" : r.status === 429 ? "slow" : "api",
               j.description || ("Telegram answered " + r.status),
               { status:r.status, retry:(j.parameters && j.parameters.retry_after) || 0 });
  }
  if (!quiet) log("  ✓");
  return j;
}

/* ── the protocol ──────────────────────────────────────────────────────── */
window.addEventListener("message", async function(ev){
  const m = ev.data;
  if (!m || m.__dossierTg !== 1 || !m.cmd) return;
  if (ev.source !== window.parent) return;
  let result = null, error = null, kind = "", extra = {};
  try {
    if (m.cmd === "ping") result = { version:TG_RELAY_VERSION };
    else if (m.cmd === "call") result = await call(m);
    else throw fail("cmd", "unknown command: " + m.cmd);
  } catch(e){
    error = String((e && e.message) || e);
    kind = (e && e.kind) || "error";
    extra = { status:(e && e.status) || 0, retry:(e && e.retry) || 0 };
  }
  window.parent.postMessage(Object.assign({ __dossierTg:1, id:m.id, ok:!error, result:result,
                                            error:error, kind:kind }, extra), "*");
});

log("relay " + TG_RELAY_VERSION + " ready");
window.parent.postMessage({ __dossierTg:1, evt:"ready", version:TG_RELAY_VERSION }, "*");
</script>
</body>
</html>
